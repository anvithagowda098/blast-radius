name: tests

# Proves the repo reproduces from a clean clone: tests on the oldest and newest
# supported Python, the built Switch template is current, and both demo scripts
# run under bash. No secrets, read-only token.
#
# Manual-only for now: GitHub Actions is unavailable on this account until its
# billing is sorted, and runs on push would fail at startup. To run on every
# push again, add `push:` and `pull_request:` under `on:`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/build_template.py --check
      - run: PYTHON=python scripts/demo.sh > /dev/null
      - run: PYTHON=python scripts/reset-demo.sh
