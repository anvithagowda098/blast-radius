<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <title>Blast Radius architecture: humans decide, Switch rooms coordinate, agents call a deterministic core</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- column headings -->
  <g font-weight="600" font-size="13" fill="#333" text-anchor="middle">
    <text x="110" y="34">Humans make the calls</text>
    <text x="420" y="34">Switch: rooms, links, roles, documents</text>
    <text x="725" y="34">Agents (Claude Code)</text>
    <text x="915" y="34">Deterministic core</text>
  </g>

  <!-- humans -->
  <g>
    <rect x="20" y="110" width="180" height="84" rx="8" fill="#fdf1e3" stroke="#d98c2b"/>
    <text x="110" y="134" text-anchor="middle" font-weight="600">Security lead (IC)</text>
    <text x="110" y="154" text-anchor="middle">approves scope and</text>
    <text x="110" y="170" text-anchor="middle">containment, signs off</text>
    <text x="110" y="186" text-anchor="middle">the postmortem</text>

    <rect x="20" y="360" width="180" height="84" rx="8" fill="#fdf1e3" stroke="#d98c2b"/>
    <text x="110" y="384" text-anchor="middle" font-weight="600">Team owners</text>
    <text x="110" y="404" text-anchor="middle">contain, rotate in order,</text>
    <text x="110" y="420" text-anchor="middle">report in CAN format</text>
    <text x="110" y="436" text-anchor="middle">(C · A · N)</text>
  </g>

  <!-- switch -->
  <rect x="240" y="56" width="360" height="474" rx="12" fill="#eef4fb" stroke="#4a7fc1" stroke-dasharray="6 4"/>
  <text x="256" y="76" fill="#4a7fc1" font-weight="600">template: blast-radius.template.yaml</text>

  <rect x="260" y="92" width="320" height="168" rx="8" fill="#ffffff" stroke="#4a7fc1"/>
  <text x="420" y="116" text-anchor="middle" font-weight="600">#sec-alerts</text>
  <text x="276" y="140">created by the template · kickoff @br-scout</text>
  <text x="276" y="160">role: deputy (held by br-commander)</text>
  <text x="276" y="180">doc: Runbook (template)</text>
  <text x="276" y="200">doc: Blast Radius tracker (br-commander)</text>
  <text x="276" y="220">doc: Postmortem draft (br-commander)</text>
  <text x="276" y="244" fill="#a33" font-weight="600">IC approval recorded here</text>

  <rect x="260" y="360" width="150" height="110" rx="8" fill="#ffffff" stroke="#4a7fc1"/>
  <text x="335" y="384" text-anchor="middle" font-weight="600">br-web</text>
  <text x="335" y="406" text-anchor="middle">opened by br-commander</text>
  <text x="335" y="424" text-anchor="middle">after IC approval</text>
  <text x="335" y="446" text-anchor="middle">owner + br-planner</text>

  <rect x="430" y="360" width="150" height="110" rx="8" fill="#ffffff" stroke="#4a7fc1"/>
  <text x="505" y="384" text-anchor="middle" font-weight="600">br-payments</text>
  <text x="505" y="406" text-anchor="middle">opened by br-commander</text>
  <text x="505" y="424" text-anchor="middle">after IC approval</text>
  <text x="505" y="446" text-anchor="middle">owner + br-planner</text>

  <!-- links, both directions -->
  <g stroke="#4a7fc1" stroke-width="1.5" fill="none">
    <line x1="320" y1="262" x2="320" y2="356" marker-end="url(#arrow)"/>
    <line x1="350" y1="356" x2="350" y2="262" marker-end="url(#arrow)"/>
    <line x1="490" y1="262" x2="490" y2="356" marker-end="url(#arrow)"/>
    <line x1="520" y1="356" x2="520" y2="262" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#4a7fc1">
    <text x="272" y="300">incident</text>
    <text x="355" y="326">parent</text>
    <text x="442" y="300">incident</text>
    <text x="525" y="326">parent</text>
  </g>
  <text x="420" y="500" text-anchor="middle" fill="#555">one linked room per affected team</text>

  <!-- human <-> room arrows -->
  <g stroke="#d98c2b" stroke-width="1.5" fill="none">
    <line x1="202" y1="152" x2="256" y2="152" marker-end="url(#arrow)"/>
    <line x1="202" y1="402" x2="256" y2="402" marker-end="url(#arrow)"/>
  </g>

  <!-- agents -->
  <g>
    <rect x="640" y="92" width="170" height="64" rx="8" fill="#eaf6ec" stroke="#3c8f50"/>
    <text x="725" y="116" text-anchor="middle" font-weight="600">br-scout</text>
    <text x="725" y="134" text-anchor="middle">affected repos</text>
    <text x="725" y="149" text-anchor="middle" fill="#666" font-size="11">anyone in #sec-alerts</text>

    <rect x="640" y="172" width="170" height="64" rx="8" fill="#eaf6ec" stroke="#3c8f50"/>
    <text x="725" y="196" text-anchor="middle" font-weight="600">br-forensics</text>
    <text x="725" y="214" text-anchor="middle">CI exposure + owners</text>
    <text x="725" y="229" text-anchor="middle" fill="#666" font-size="11">anyone in #sec-alerts</text>

    <rect x="640" y="252" width="170" height="80" rx="8" fill="#eaf6ec" stroke="#3c8f50"/>
    <text x="725" y="276" text-anchor="middle" font-weight="600">br-commander</text>
    <text x="725" y="294" text-anchor="middle">opens + links rooms,</text>
    <text x="725" y="309" text-anchor="middle">tracker, postmortem</text>
    <text x="725" y="324" text-anchor="middle" fill="#666" font-size="11">owner + owner's agents only</text>

    <rect x="640" y="372" width="170" height="80" rx="8" fill="#eaf6ec" stroke="#3c8f50"/>
    <text x="725" y="396" text-anchor="middle" font-weight="600">br-planner</text>
    <text x="725" y="414" text-anchor="middle">checklists, CAN replies</text>
    <text x="725" y="429" text-anchor="middle">→ tracker updates</text>
    <text x="725" y="444" text-anchor="middle" fill="#666" font-size="11">anyone (team rooms)</text>
  </g>

  <!-- agent <-> room arrows -->
  <g stroke="#3c8f50" stroke-width="1.5" fill="none">
    <line x1="638" y1="124" x2="584" y2="124" marker-end="url(#arrow)"/>
    <line x1="638" y1="204" x2="584" y2="204" marker-end="url(#arrow)"/>
    <line x1="638" y1="292" x2="560" y2="262" marker-end="url(#arrow)"/>
    <line x1="638" y1="412" x2="584" y2="412" marker-end="url(#arrow)"/>
  </g>

  <!-- core -->
  <rect x="840" y="92" width="150" height="360" rx="8" fill="#f3f0fa" stroke="#6b55a8"/>
  <text x="915" y="116" text-anchor="middle" font-weight="600">python -m</text>
  <text x="915" y="132" text-anchor="middle" font-weight="600">blast_radius</text>
  <g text-anchor="middle">
    <text x="915" y="162">scout</text>
    <text x="915" y="182">forensics</text>
    <text x="915" y="202">plan</text>
    <text x="915" y="222">tracker</text>
    <text x="915" y="242">postmortem</text>
    <text x="915" y="262">hostcheck · reset</text>
  </g>
  <line x1="856" y1="282" x2="974" y2="282" stroke="#6b55a8"/>
  <g text-anchor="middle" fill="#555" font-size="11">
    <text x="915" y="304">reads lockfiles,</text>
    <text x="915" y="319">workflows, CODEOWNERS</text>
    <text x="915" y="342">writes out/*.json</text>
    <text x="915" y="365">offline · no LLM</text>
    <text x="915" y="380">pytest-covered</text>
  </g>

  <!-- agent -> core arrows -->
  <g stroke="#6b55a8" stroke-width="1.5" fill="none">
    <line x1="812" y1="124" x2="836" y2="124" marker-end="url(#arrow)"/>
    <line x1="812" y1="204" x2="836" y2="204" marker-end="url(#arrow)"/>
    <line x1="812" y1="292" x2="836" y2="292" marker-end="url(#arrow)"/>
    <line x1="812" y1="412" x2="836" y2="412" marker-end="url(#arrow)"/>
  </g>

  <text x="500" y="552" text-anchor="middle" fill="#555">Agents do the paperwork; humans make the calls. Forensics reports exposure, not proof of exfiltration.</text>
</svg>
