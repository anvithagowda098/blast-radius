name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install (private registry)
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - run: npm run build
      - name: Fetch runtime config
        run: vault kv get -format=json secret/payments-api > config.json
        env:
          VAULT_ADDR: https://vault.internal.example
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      - name: Ship to bastion
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$SSH_KEY" > deploy_key
          ./scripts/ship.sh
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

  migrate:
    needs: deploy
    runs-on: ubuntu-latest
    container: ghcr.io/acme/migrator:1.4
    steps:
      - run: migrator up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
